name: Sync public tournament

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Trigger source
        required: false
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: public-tournament-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public site
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install sync dependencies
        run: python -m pip install -r automation/requirements.txt

      - name: Test synchronization rules
        run: python -m unittest discover -s automation -p "test_*.py"

      - name: Download registrations and consented photos
        env:
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          SYNC_MANIFEST_SPREADSHEET_ID: ${{ vars.SYNC_MANIFEST_SPREADSHEET_ID }}
        run: python automation/sync_public.py

      - name: Check generated public data
        run: |
          python -m json.tool tournament_public.json > /dev/null
          git diff --check -- tournament_public.json fighter_photos

      - name: Commit and publish
        run: |
          git add -- tournament_public.json fighter_photos
          if git diff --cached --quiet; then
            echo "No public changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tournament data and consented photos"
          git push origin HEAD:main

      - name: Record successful publication
        run: python automation/sync_public.py --mark-success
