[theme]
font = "sans serif"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#8a7600"
backgroundColor = "#f4f4f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#171717"
borderColor = "#deded9"

[theme.dark]
primaryColor = "#8a7600"
backgroundColor = "#111111"
secondaryBackgroundColor = "#1c1c1c"
textColor = "#f1f1f1"
borderColor = "#414141"
